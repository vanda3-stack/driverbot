<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>DriverBot Controller</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color: transparent;
    font-family:Arial, sans-serif;
}

body{
    background:#0f172a;
    color:white;
    overflow:hidden;
    touch-action:manipulation;
}

/* ===== TOPBAR ===== */

.topbar{
    height:70px;
    background:#111827;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 20px;
    border-bottom:2px solid #1f2937;
}

.robot-info{
    font-size:26px;
    font-weight:bold;
}

.status{
    font-size:16px;
    color:#f87171;
    font-weight:bold;
}

.connect-btn{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 22px;
    border-radius:18px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,0.4);
}

.connect-btn:active{
    transform:scale(0.95);
}

/* ===== MAIN ===== */

.gamepad-layout{
    height:calc(100vh - 70px);
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px;
}

/* ===== LEFT CONTROLLER ===== */

.controller{
    display:grid;
    grid-template-columns:110px 110px 110px;
    grid-template-rows:110px 110px 110px;
    gap:15px;
}

.move-btn{
    border:none;
    border-radius:30px;
    background:#1e293b;
    color:white;
    font-size:40px;
    font-weight:bold;
    box-shadow:0 6px 12px rgba(0,0,0,0.5);
    cursor:pointer;
}

.move-btn:active{
    transform:scale(0.92);
    background:#334155;
}

.forward{
    grid-column:2;
    grid-row:1;
}

.left{
    grid-column:1;
    grid-row:2;
}

.stop{
    grid-column:2;
    grid-row:2;
    background:#dc2626;
}

.right{
    grid-column:3;
    grid-row:2;
}

.backward{
    grid-column:2;
    grid-row:3;
}

/* ===== RIGHT SERVO ===== */

.servo-panel{
    display:flex;
    flex-direction:column;
    gap:25px;
}

.servo-btn,
.servo-stop{
    width:110px;
    height:110px;
    border:none;
    border-radius:30px;
    color:white;
    font-size:42px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 6px 12px rgba(0,0,0,0.5);
}

.servo-btn{
    background:#10b981;
}

.servo-stop{
    background:#f59e0b;
}

.servo-btn:active,
.servo-stop:active{
    transform:scale(0.92);
}

/* ===== RESPONSIVE ===== */

@media (max-width:900px){

    .gamepad-layout{
        flex-direction:row;
        align-items:center;
        justify-content:space-between;
    }

    .controller{
        transform:scale(0.82);
    }

    .servo-panel{
        transform:scale(0.82);
    }

}

@media (max-width:700px){

    .topbar{
        padding:10px;
    }

    .robot-info{
        font-size:18px;
    }

    .connect-btn{
        padding:10px 14px;
        font-size:14px;
    }

    .status{
        font-size:13px;
    }

    .controller{
        transform:scale(0.72);
        margin-left:-20px;
    }

    .servo-panel{
        transform:scale(0.72);
        margin-right:-20px;
    }

}

</style>
</head>

<body>

<!-- ===== TOPBAR ===== -->

<div class="topbar">

    <div class="robot-info">
        🤖 DriverBot
    </div>

    <div id="status" class="status">
        🔴 Chưa kết nối
    </div>

    <button class="connect-btn" onclick="connectBluetooth()">
        Kết nối
    </button>

</div>

<!-- ===== MAIN ===== -->

<div class="gamepad-layout">

    <!-- ===== LEFT ===== -->

    <div class="controller">

        <button class="move-btn forward"
            ontouchstart="startCommand('tien')"
            ontouchend="stopCommand()"
            onmousedown="startCommand('tien')"
            onmouseup="stopCommand()">
            ↑
        </button>

        <button class="move-btn left"
            ontouchstart="startCommand('trai')"
            ontouchend="stopCommand()"
            onmousedown="startCommand('trai')"
            onmouseup="stopCommand()">
            ←
        </button>

        <button class="move-btn stop"
            onclick="sendCommand('dung')">
            ■
        </button>

        <button class="move-btn right"
            ontouchstart="startCommand('phai')"
            ontouchend="stopCommand()"
            onmousedown="startCommand('phai')"
            onmouseup="stopCommand()">
            →
        </button>

        <button class="move-btn backward"
            ontouchstart="startCommand('lui')"
            ontouchend="stopCommand()"
            onmousedown="startCommand('lui')"
            onmouseup="stopCommand()">
            ↓
        </button>

    </div>

    <!-- ===== RIGHT ===== -->

    <div class="servo-panel">

        <button class="servo-btn"
            onclick="sendCommand('len')">
            ↑
        </button>

        <button class="servo-stop"
            onclick="sendCommand('dungservo')">
            ■
        </button>

        <button class="servo-btn"
            onclick="sendCommand('xuong')">
            ↓
        </button>

    </div>

</div>

<script>

let bluetoothDevice;
let uartCharacteristic;

// ===== BLUETOOTH =====

async function connectBluetooth(){

    try{

        bluetoothDevice = await navigator.bluetooth.requestDevice({
            filters:[
                { namePrefix: "BBC micro:bit" }
            ],
            optionalServices:[
                '6e400001-b5a3-f393-e0a9-e50e24dcca9e'
            ]
        });

        const server = await bluetoothDevice.gatt.connect();

        const service = await server.getPrimaryService(
            '6e400001-b5a3-f393-e0a9-e50e24dcca9e'
        );

        uartCharacteristic = await service.getCharacteristic(
            '6e400002-b5a3-f393-e0a9-e50e24dcca9e'
        );

        document.getElementById("status").innerHTML =
            "🟢 Đã kết nối";

    }catch(error){

        alert("Không thể kết nối Bluetooth");
        console.log(error);

    }

}

// ===== SEND COMMAND =====

async function sendCommand(command){

    if(!uartCharacteristic){
        alert("Chưa kết nối Microbit");
        return;
    }

    let encoder = new TextEncoder();
    let data = encoder.encode(command + "#");

    try{

        await uartCharacteristic.writeValue(data);

    }catch(error){

        console.log(error);

    }

}

// ===== HOLD BUTTON =====

function startCommand(command){
    sendCommand(command);
}

function stopCommand(){
    sendCommand("dung");
}

// ===== PREVENT SCROLL =====

document.body.addEventListener('touchmove', function(e) {
    e.preventDefault();
}, { passive: false });

</script>

</body>
</html>
